version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20-alpine
    image: medprofile:latest
    container_name: medprofile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # NUXT_PUBLIC_SITE_URL: "https://your-domain.com"
    restart: unless-stopped
